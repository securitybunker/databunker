name: Tests

on: [push]

jobs:
  build:

    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.22'
    - name: Run golint
      run: |
        go version
        sudo apt install -y golint
        cd src
        golint
        cd ..
        echo done
    - name: Download deps
      run: |
        cd src
        go get -d -v
        echo done
    - name: Run go vet
      run: |
        cd src
        go vet
        echo done
    - name: Run go test
      run: |
        cd src
        go test
        echo done
